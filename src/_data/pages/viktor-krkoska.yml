bio:
  sk: "Ing. arch. Viktor Krkoška, absolvent Fakulty architektúry a dizajnu STU v Bratislave so semestrálnym pobytom na École Nationale Supérieure d'Architecture de Lyon. Od 9/2022 do 6/2026 pôsobil v ateliéri Hantabal architekti, kde prešiel celým procesom projektu — od konceptu cez technické výkresy a rendering až po 3D tlač fyzických modelov a prípravu prezentácií pre klienta."
  en: "Ing. arch. Viktor Krkoška, a graduate of the Faculty of Architecture and Design at the Slovak University of Technology (STU) in Bratislava, with a semester abroad at the École Nationale Supérieure d'Architecture de Lyon. From 9/2022 to 6/2026 he worked at Hantabal architekti, where he went through the entire project process — from concept through technical drawings and rendering to 3D-printing physical models and preparing client presentations."
