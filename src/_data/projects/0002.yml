body:
  sk:
    - "Transformácia bývalej predajne OBI na Bajkalskej ulici — pôvodne Baumax od architektov Škandíka a Spáčila (2001–2003) — z monofunkčného boxu na flexibilný polyfunkčný priestor s výrazným verejným charakterom."
    - "Návrh reaguje na urbanistickú víziu MIB, ktorá predpokladá premenu priemyselnej zóny Mlynské Nivy na obytnú štvrť. Obvodový plášť je posunutý dovnútra o jeden konštrukčný modul, čím vzniká transparentné predpolie prepájajúce budúcu obytnú zónu s novým parkom."
    - "Objekt sa delí na štyri funkčné celky: krytý verejný priestor na eventy a trhy, coworking s rotujúcimi priečkami, prenajímateľné ateliéry v podzemí a pôvodnú hobby predajňu so záhradným centrom. Pôvodné parkovisko ustupuje zeleni, spevneným plochám a systému zadržiavania dažďovej vody."
  en:
    - "Transformation of a former OBI store on Bajkalská Street — originally a Baumax by architects Škandík and Spáčil (2001–2003) — from a single-use big-box store into a flexible, mixed-use space with a strong public character."
    - "The proposal responds to MIB's urban vision, which foresees the transformation of the Mlynské Nivy industrial zone into a residential district. The building envelope is pulled inward by one structural bay, creating a transparent forecourt that links the future residential zone with a new park."
    - "The building is organized into four functional zones: a covered public space for events and markets, a coworking area with rotating partitions, rentable studios below grade, and the original hobby/DIY store with a garden centre. The original car park gives way to greenery, hard-surfaced areas and a rainwater retention system."
